---
name: Report an issue with Better Xiaomi Cloud Map Extractor
description: Report an issue with Better Xiaomi Cloud Map Extractor.
labels: bug
assignees: 'Igloczek'
body:
  - type: markdown
    attributes:
      value: |
        This issue form is for reporting bugs only!

        If you have a question, feature or enhancement request, please use the dedicated form.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have updated the integration to the latest version available
          required: true
        - label: I have checked if the problem is already reported
          required: true
  - type: textarea
    validations:
      required: true
    attributes:
      label: The problem
      description: >-
        Describe the issue you are experiencing here.
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    id: bug-version
    validations:
      required: true
    attributes:
      label: What version of an integration has described problem?
      placeholder: vX.X.X
  - type: input
    id: last-working-version
    validations:
      required: false
    attributes:
      label: What was the last working version of an integration?
      placeholder: vX.X.X
      description: >
        If known, otherwise leave blank.
  - type: input
    id: vacuum-model
    validations:
      required: true
    attributes:
      label: What vacuum model do you have problems with?
      placeholder: roborock.vacuum.s5e
  - type: input
    id: ha-version
    validations:
      required: true
    attributes:
      label: What version of Home Assistant do you use?
      placeholder: core-
      description: >
        Can be found in: [Configuration panel -> Info](https://my.home-assistant.io/redirect/info/).

        [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
  - type: dropdown
    validations:
      required: true
    attributes:
      label: What type of installation are you running?
      description: >
        Can be found in: [Configuration panel -> Info](https://my.home-assistant.io/redirect/info/).

        [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
  - type: markdown
    attributes:
      value: |
        # Details
  - type: markdown
    attributes:
      value: |
        **Remove secrets before posting.** Diagnostics and debug logs can contain Xiaomi account
        tokens (`serviceToken`, `ssecurity`, `passToken`), passwords, the vacuum's token and IP
        address. Replace anything that looks like one with `<redacted>`.
  - type: input
    id: map-format
    validations:
      required: false
    attributes:
      label: Map format
      description: >
        The map format (Used map API) picked in the last setup step, if you know it.
      placeholder: Roborock, Viomi, Roidmi, Dreame, Ijai or Xiaomi
  - type: textarea
    id: diagnostics
    validations:
      required: false
    attributes:
      label: Diagnostics
      description: >
        Settings → Devices & services → Better Xiaomi Cloud Map Extractor → the vacuum's entry → ⋮ →
        Download diagnostics. Attach the file or paste it here, after removing secrets.
  - type: textarea
    id: debug-log
    validations:
      required: false
    attributes:
      label: Debug log
      description: >
        Turn on debug logging for `custom_components.better_xiaomi_cloud_map_extractor` (see the
        README, "Reporting a problem"), reproduce the problem and paste the log here, after removing
        secrets.
      render: shell
  - type: textarea
    attributes:
      label: Additional information
      description: >
        If you have any additional information, use the field below.
