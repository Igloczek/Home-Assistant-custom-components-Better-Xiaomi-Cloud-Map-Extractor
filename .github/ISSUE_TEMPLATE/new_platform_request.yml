---
name: Request for support of a new vacuum/platform
description: Request for support of a new vacuum/platform
labels:
  - new platform
  - enhancement
assignees: 'Igloczek'
body:
  - type: markdown
    attributes:
      value: |
        Using this form you can create a request for a new supported vacuum/platform.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have updated the integration to the latest version available
          required: true
        - label: I have checked if the vacuum/platform is already requested
          required: true
        - label: I can share a raw map file from this vacuum when asked (it shows the layout of your home, so do not attach it here unasked)
          required: false
  - type: input
    id: vacuum-model
    validations:
      required: true
    attributes:
      label: What vacuum model do you want to be supported?
      placeholder: roborock.vacuum.s5e
  - type: input
    id: vacuum-model-name
    validations:
      required: true
    attributes:
      label: What is its name?
      placeholder: Roborock S5 Max
  - type: checkboxes
    id: available-apis
    attributes:
      label: Map formats tried
      description: >-
        Set the vacuum up (Add integration → Better Xiaomi Cloud Map Extractor) and, in the last
        setup step, pick each map format under **Used map API** in turn. Check the ones that show a
        map.
      options:
        - label: Roborock
        - label: Viomi
        - label: Roidmi
        - label: Dreame
        - label: Ijai
        - label: Xiaomi
  - type: textarea
    attributes:
      label: Errors shown in the HA logs (if applicable)
      render: shell
  - type: textarea
    attributes:
      label: Other info
